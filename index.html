<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>D’s Dojo — Workout Journal</title>
<style>
:root{
 --bg:#f4f6fa;--surface:#fff;--surface2:#f8fafc;--text:#111827;--muted:#667085;
 --line:#e4e7ec;--primary:#111827;--accent:#2563eb;--accent-soft:#eff6ff;
 --success:#16a34a;--success-soft:#ecfdf3;--danger:#dc2626;--danger-soft:#fef2f2;
 --shadow:0 10px 35px rgba(15,23,42,.07);--radius:18px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}
.app{max-width:1240px;margin:auto;padding:18px 20px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:13px;background:#111827;color:#fff;display:grid;place-items:center}
.mark svg{width:24px;height:24px}.brand h1{font-size:23px;line-height:1;margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:11px;padding:9px 12px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.dark{background:#111827;border-color:#111827;color:#fff}.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff}.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center}.btn svg{width:17px;height:17px}
.nav{display:flex;gap:6px;padding:5px;background:#e9edf4;border-radius:13px;margin-bottom:17px}.nav button{flex:1;border:0;background:transparent;color:#667085;border-radius:9px;padding:10px;font-weight:800}.nav button.active{background:#fff;color:#111827;box-shadow:0 2px 8px rgba(15,23,42,.07)}
.splitbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.split{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;text-align:left}.split.active{border:2px solid var(--accent);padding:12px;background:var(--accent-soft)}.split strong{display:block}.split small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}
.daynav{display:flex;gap:8px;overflow:auto;padding:2px 1px 8px;margin-bottom:10px}.day{min-width:135px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;text-align:left}.day.active{background:#111827;color:#fff;border-color:#111827}.day .n{font-size:10px;opacity:.6;font-weight:800;letter-spacing:.08em}.day .d{font-weight:800;margin-top:4px;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.head{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.head h2{font-size:20px;margin:0}.head p{font-size:13px;color:var(--muted);margin:5px 0 0}.pill{background:#f2f4f7;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.exercise{padding:13px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start}.exercise:last-child{border-bottom:0}.exercise.done{background:#f8fafc}.check{width:21px;height:21px;margin-top:3px;accent-color:var(--success)}.ename{font-weight:800;color:#175cd3;text-decoration:none}.ename:hover{text-decoration:underline}.done .ename{text-decoration:line-through;color:#667085}.meta{font-size:12px;color:var(--muted);margin-top:4px}.logline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini{width:72px;border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:#fff;font-size:12px}
.side{padding:16px}.side-section{padding-bottom:17px;margin-bottom:17px;border-bottom:1px solid var(--line)}.side-section:last-child{border:0;margin:0;padding:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900;margin:0 0 9px}.progressrow{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.bar{height:9px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--accent);width:0;transition:width .2s}.textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.section{margin-bottom:16px}.section .head{border-radius:var(--radius)}.history{padding:14px;display:grid;gap:10px}.entry{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.entrytop{display:flex;justify-content:space-between;gap:10px}.entry b{font-size:14px}.entry small{color:var(--muted)}.entry p{white-space:pre-wrap;font-size:13px;margin:8px 0 0}.entry .tag{font-size:11px;background:var(--success-soft);color:#087443;padding:5px 8px;border-radius:999px;font-weight:800}
.library{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:14px}.libitem{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.libitem a{font-weight:800;color:#175cd3;text-decoration:none}.libitem small{display:block;color:var(--muted);margin-top:3px}
.empty{text-align:center;padding:36px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.22)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0;font-size:19px}.form{display:grid;gap:11px}.form label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;color:#475467}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.choice{display:grid;gap:8px}.choice label{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);padding:11px;border-radius:11px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:700}.choice input{width:auto;margin-top:3px}
.manage-list{display:grid;gap:8px}.manage-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border:1px solid var(--line);border-radius:11px;padding:10px}.manage-item .tools{display:flex;gap:5px}.tiny{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:none;z-index:30;box-shadow:0 10px 25px rgba(0,0,0,.2)}.toast.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}.side-section{border:0;margin:0;padding:0}.side-section.note{grid-column:1/-1}.library{grid-template-columns:1fr}}
@media(max-width:620px){.app{padding:12px 12px 30px}.top{align-items:flex-start}.actions .btn:not(.primary){font-size:12px;padding:8px}.splitbar{grid-template-columns:1fr}.grid{gap:12px}.side{display:block}.side-section{border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:14px}.side-section:last-child{border:0}.library{grid-template-columns:1fr}.exercise{grid-template-columns:27px minmax(0,1fr)}.logline{grid-column:2}.row{grid-template-columns:1fr}.nav{position:sticky;top:0;z-index:8}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4v16M18 4v16M3 7h6M15 7h6M3 17h6M15 17h6"/><path d="M9 5h6v14H9z"/></svg></div>
  <div><h1>D’s Dojo</h1><p>Train · Track · Improve</p></div>
 </div>
 <div class="actions">
  <button class="btn" onclick="openAdd()">Add exercise</button>
  <button class="btn" onclick="openCustomize()">Customize</button>
  <button class="btn dark" onclick="exportBackup()">Backup</button>
 </div>
</header>

<nav class="nav">
 <button id="navPlan" class="active" onclick="showTab('plan')">Plan</button>
 <button id="navJournal" onclick="showTab('journal')">Journal</button>
 <button id="navLibrary" onclick="showTab('library')">Exercise library</button>
</nav>

<main id="planTab">
 <div class="splitbar" id="splitbar"></div>
 <div class="daynav" id="daynav"></div>
 <div class="grid">
  <section class="card">
   <div class="head"><div><h2 id="workoutTitle"></h2><p id="workoutDesc"></p></div><span class="pill" id="progressPill"></span></div>
   <div id="exerciseList"></div>
  </section>
  <aside class="card side">
   <div class="side-section">
    <p class="eyebrow">Today's progress</p>
    <div class="progressrow"><span id="progressText">0 / 0</span><span id="progressPct">0%</span></div>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
   </div>
   <div class="side-section note">
    <p class="eyebrow">Workout journal</p>
    <textarea class="textarea" id="dayNote" placeholder="Energy, PRs, form notes, how the session felt..."></textarea>
    <button class="btn primary" style="margin-top:8px;width:100%" onclick="saveNote()">Save journal note</button>
   </div>
   <div class="side-section">
    <p class="eyebrow">Quick actions</p>
    <div class="quick"><button class="btn" onclick="openCustomize()">Edit day</button><button class="btn" onclick="resetDay()">Reset checks</button></div>
   </div>
  </aside>
 </div>
</main>

<main id="journalTab" style="display:none">
 <section class="card"><div class="head"><div><h2>Workout journal</h2><p>Every saved session keeps date, exercise, sets, reps, weight and notes.</p></div><button class="btn danger" onclick="clearJournal()">Clear journal</button></div><div id="history" class="history"></div></section>
</main>

<main id="libraryTab" style="display:none">
 <section class="card"><div class="head"><div><h2>Exercise library</h2><p>Exercises available for adding to any workout day.</p></div><button class="btn primary" onclick="openAdd('library')">Add to library</button></div><div id="library" class="library"></div></section>
</main>
</div>

<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn icon" onclick="closeModal()">×</button></div><div id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div>

const STORAGE = "ds-dojo-v2";
let saved = JSON.parse(localStorage.getItem(STORAGE)||"null");
let state = saved || {
 activeSplit:0,activeDay:0,checks:{},logs:{},notes:{},sessions:[],
 customSplits:null,customExercises:[]
};
if(!state.customSplits) state.customSplits=structuredClone(BASE.splits);
if(!state.customExercises) state.customExercises=[];
let modalMode="";

function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove("show"),1600)}
function split(){return state.customSplits[state.activeSplit]}
function day(){return split().days[state.activeDay]}
function key(){return split().id+"-"+state.activeDay}
function items(){return day().items||[]}

function render(){
 renderSplits();renderDays();renderWorkout();renderLibrary();renderHistory();
}
function renderSplits(){
 document.getElementById("splitbar").innerHTML=state.customSplits.map((s,i)=>`<button class="split ${i===state.activeSplit?'active':''}" onclick="selectSplit(${i})"><strong>${esc(s.short||'SET '+(i+1))} · ${esc(s.name)}</strong><small>${esc(s.description||'')}</small></button>`).join("");
}
function renderDays(){
 document.getElementById("daynav").innerHTML=split().days.map((d,i)=>`<button class="day ${i===state.activeDay?'active':''}" onclick="selectDay(${i})"><div class="n">DAY ${i+1}</div><div class="d">${esc(d.name)}</div></button>`).join("")+
 `<button class="day" onclick="toast('Day 7 is reserved for rest / recovery')"><div class="n">DAY 7</div><div class="d">Rest / Recovery</div></button>`;
}
function renderWorkout(){
 const d=day(), a=items(), k=key(), done=a.filter((_,i)=>state.checks[k+"-"+i]).length,p=a.length?Math.round(done/a.length*100):0;
 document.getElementById("workoutTitle").textContent=`Day ${state.activeDay+1} · ${d.name}`;
 document.getElementById("workoutDesc").textContent=(d.focus?d.focus+" · ":"")+split().name;
 document.getElementById("progressPill").textContent=`${done}/${a.length} complete`;
 document.getElementById("progressText").textContent=`${done} / ${a.length}`;
 document.getElementById("progressPct").textContent=p+"%";document.getElementById("progressFill").style.width=p+"%";
 document.getElementById("dayNote").value=state.notes[k]||"";
 document.getElementById("exerciseList").innerHTML=a.length?a.map((e,i)=>{
   const checked=!!state.checks[k+"-"+i], l=state.logs[k+"-"+i]||{};
   const setRows=Array.from({length:Number(e.sets)||1},(_,s)=>{
      const sl=(l.sets&&l.sets[s])||{};
      return `<div class="logline"><span class="meta" style="align-self:center">Set ${s+1}</span><input class="mini" placeholder="kg" value="${esc(sl.weight||'')}" onchange="setSetLog(${i},${s},'weight',this.value)"><input class="mini" placeholder="reps" value="${esc(sl.reps||'')}" onchange="setSetLog(${i},${s},'reps',this.value)"></div>`
   }).join("");
   return `<div class="exercise ${checked?'done':''}">
    <input class="check" type="checkbox" ${checked?'checked':''} onchange="toggle(${i},this.checked)">
    <div><a class="ename" href="${esc(e.url||'#')}" target="_blank" rel="noopener">${esc(e.name)}</a><div class="meta">${e.sets} sets × ${esc(e.reps)} reps target</div>${setRows}</div>
    <button class="btn icon" title="Remove from this day" onclick="removeExercise(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>
   </div>`
 }).join(""):`<div class="empty"><strong>This day is empty</strong>Add an exercise to build the workout.</div>`;
}
function renderLibrary(){
 const all={}; state.customSplits.forEach(s=>s.days.forEach(d=>d.items.forEach(e=>all[e.id]=e)));state.customExercises.forEach(e=>all[e.id]=e);
 document.getElementById("library").innerHTML=Object.values(all).sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<div class="libitem"><div><a href="${esc(e.url||'#')}" target="_blank" rel="noopener">${esc(e.name)}</a><small>${e.sets||''} sets × ${esc(e.reps||'')}</small></div><button class="tiny" onclick="openEditExercise('${esc(e.id)}')">Edit</button></div>`).join("");
}
function renderHistory(){
 const h=document.getElementById("history"), a=state.sessions||[];
 h.innerHTML=a.length?a.map(x=>`<div class="entry"><div class="entrytop"><div><b>${esc(x.split)} · ${esc(x.day)}</b><div><small>${esc(x.date)}</small></div></div><span class="tag">Completed</span></div>${x.note?`<p>${esc(x.note)}</p>`:""}${x.summary?`<p class="muted">${esc(x.summary)}</p>`:""}</div>`).join(""):`<div class="empty"><strong>No completed sessions yet</strong>Complete all exercises in a workout to create a journal entry.</div>`;
}
function selectSplit(i){state.activeSplit=i;state.activeDay=0;save();render()}
function selectDay(i){state.activeDay=i;save();renderWorkout();renderDays()}
function toggle(i,v){
 state.checks[key()+"-"+i]=v;save();renderWorkout();
 if(v && items().length && items().every((_,j)=>state.checks[key()+"-"+j])) completeSession();
}
function setSetLog(i,s,k,v){
 const kk=key()+"-"+i;state.logs[kk]=state.logs[kk]||{};state.logs[kk].sets=state.logs[kk].sets||[];
 state.logs[kk].sets[s]=state.logs[kk].sets[s]||{};state.logs[kk].sets[s][k]=v;save();
}
function saveNote(){state.notes[key()]=document.getElementById("dayNote").value;save();toast("Journal note saved")}
function completeSession(){
 const today=new Date().toISOString().slice(0,10), k=key();
 const exists=(state.sessions||[]).some(x=>x.key===k&&x.date===today);if(exists)return;
 const summary=items().map((e,i)=>{const l=state.logs[k+"-"+i]||{};const ss=(l.sets||[]).map((s,n)=>`S${n+1}: ${s.weight||'—'}kg × ${s.reps||'—'}`).join(" | ");return `${e.name}: ${ss||'no set log'}`}).join(" • ");
 state.sessions.unshift({key:k,date:today,split:split().name,day:day().name,note:state.notes[k]||"",summary});save();renderHistory();toast("Workout saved to journal");
}
function resetDay(){items().forEach((_,i)=>delete state.checks[key()+"-"+i]);save();renderWorkout();toast("Workout checks reset")}
function removeExercise(i){if(!confirm("Remove this exercise from this day?"))return;day().items.splice(i,1);save();render();toast("Exercise removed")}
function clearJournal(){if(confirm("Delete all saved journal sessions?")){state.sessions=[];save();renderHistory();}}
function showTab(t){["plan","journal","library"].forEach(x=>{document.getElementById(x+"Tab").style.display=x===t?"block":"none";document.getElementById("nav"+x[0].toUpperCase()+x.slice(1)).classList.toggle("active",x===t)})}

function openModal(title,body,foot){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalFoot").innerHTML=foot;document.getElementById("modal").classList.add("open")}

function openAdd(mode="day"){
 modalMode=mode;
 openModal("Add exercise",`

  <div><label>Exercise name</label><input id="fName" placeholder="e.g. Dumbbell Lunges"></div>
  <div class="row"><div><label>Target sets</label><input id="fSets" type="number" min="1" value="3"></div><div><label>Target reps</label><input id="fReps" value="8–12"></div></div>

  <div><label>Add where?</label><div class="choice">

  </div></div>
 </div>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewExercise()">Add exercise</button>`);

function saveNewExercise(){
 const name=document.getElementById("fName").value.trim();if(!name)return toast("Enter an exercise name");
 const e={id:"custom-"+Date.now(),name,sets:Number(document.getElementById("fSets").value)||1,reps:document.getElementById("fReps").value.trim()||"8–12",url:document.getElementById("fUrl").value.trim()};
 const where=document.querySelector('input[name="where"]:checked').value;
 if(where==="library"||where==="both")state.customExercises.push(e);
 if(where==="day"||where==="both")day().items.push(e);
 save();closeModal();render();toast("Exercise added");
}
function openEditExercise(id){
 let e=null;
 for(const s of state.customSplits)for(const d of s.days)for(const x of d.items)if(x.id===id)e=x;
 e=e||state.customExercises.find(x=>x.id===id);if(!e)return;
 openModal("Edit exercise",`<div class="form"><div><label>Name</label><input id="efName" value="${esc(e.name)}"></div><div class="row"><div><label>Sets</label><input id="efSets" type="number" min="1" value="${e.sets}"></div><div><label>Target reps</label><input id="efReps" value="${esc(e.reps)}"></div></div><div><label>Guide URL</label><input id="efUrl" value="${esc(e.url||"")}"></div></div>`,
 `<button class="btn danger" onclick="deleteLibraryExercise('${esc(id)}')">Delete from library</button><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveExerciseEdit('${esc(id)}')">Save</button>`);
}
function findExercise(id){for(const s of state.customSplits)for(const d of s.days)for(const e of d.items)if(e.id===id)return e;return state.customExercises.find(e=>e.id===id)}
function saveExerciseEdit(id){
 const old=findExercise(id),name=document.getElementById("efName").value.trim();if(!old||!name)return;
 const vals={name,sets:Number(document.getElementById("efSets").value)||1,reps:document.getElementById("efReps").value.trim()||"8–12",url:document.getElementById("efUrl").value.trim()};
 state.customSplits.forEach(s=>s.days.forEach(d=>d.items.forEach(e=>{if(e.id===id)Object.assign(e,vals)})));state.customExercises.forEach(e=>{if(e.id===id)Object.assign(e,vals)});
 save();closeModal();render();toast("Exercise updated");
}
function deleteLibraryExercise(id){
 if(!confirm("Remove this custom exercise from the library? Existing copies in workout days will stay."))return;
 state.customExercises=state.customExercises.filter(e=>e.id!==id);save();closeModal();render();toast("Removed from library");
}

function openCustomize(){
 const s=split(),d=day();
 openModal("Customize workout",`
 <div class="form">
  <div class="row"><div><label>Split label</label><input id="csShort" value="${esc(s.short||"")}"></div><div><label>Split name</label><input id="csName" value="${esc(s.name)}"></div></div>
  <div><label>Split description</label><textarea id="csDesc" class="textarea" style="min-height:70px">${esc(s.description||"")}</textarea></div>
  <div><label>Day label</label><input id="cdName" value="${esc(d.name)}"></div>
  <div><label>Day focus</label><input id="cdFocus" value="${esc(d.focus||"")}"></div>
  <div><label>Exercises in this day</label><div class="manage-list">${d.items.map((e,i)=>`<div class="manage-item"><div><b>${esc(e.name)}</b><small class="muted"> · ${e.sets} × ${esc(e.reps)}</small></div><div class="tools"><button class="tiny" onclick="moveExercise(${i},-1)">↑</button><button class="tiny" onclick="moveExercise(${i},1)">↓</button><button class="tiny" onclick="removeExercise(${i});openCustomize()">Remove</button></div></div>`).join("")}</div></div>
 </div>`,
 `<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="saveCustomize()">Save changes</button>`);
}
function saveCustomize(){
 const s=split(),d=day();s.short=document.getElementById("csShort").value.trim()||s.short;s.name=document.getElementById("csName").value.trim()||s.name;s.description=document.getElementById("csDesc").value.trim();d.name=document.getElementById("cdName").value.trim()||d.name;d.focus=document.getElementById("cdFocus").value.trim();save();closeModal();render();toast("Workout plan updated");
}
function moveExercise(i,dir){const a=day().items,j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();openCustomize();renderWorkout();renderDays()}
function exportBackup(){
 const payload={app:"D’s Dojo",version:2,exportedAt:new Date().toISOString(),workoutPlan:state.customSplits,exerciseLibrary:state.customExercises,journal:state.sessions,checks:state.checks,logs:state.logs,notes:state.notes};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ds-dojo-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast("Backup file created");
}
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
</body>
</html>
